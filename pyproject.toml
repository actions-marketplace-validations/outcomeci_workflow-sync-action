[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "outcomeci-workflow-sync"
version = "1.0.0"
description = "Publish repository-owned workflow bundles to OutcomeCI"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["outcomeci-cli==0.59.1"]

[project.scripts]
outcomeci-sync = "outcomeci_sync.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
