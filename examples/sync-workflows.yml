name: OutcomeCI workflows
on:
  pull_request:
    paths: ['.outcomeci/workflows/**', '.github/workflows/outcomeci.yml']
  push:
    branches: [main]
    paths: ['.outcomeci/workflows/**', '.github/workflows/outcomeci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: outcomeci-workflows-${{ github.repository_id }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: outcomeci/workflow-sync-action@v1.0.0
  sync:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: outcomeci/workflow-sync-action@v1.0.0
        with:
          mode: sync
          workspace-id: ${{ vars.OUTCOMECI_WORKSPACE_ID }}
          token: ${{ secrets.OUTCOMECI_TOKEN }}
